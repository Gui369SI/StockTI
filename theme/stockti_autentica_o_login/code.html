<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">

</svg>
</div>
<input autocomplete="email" class="block w-full pl-10 pr-3 py-2.5 text-sm text-brand-dark bg-white border border-slate-300 rounded-lg placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-royal focus:border-brand-royal transition duration-150" id="email-address" name="email" placeholder="usuario@empresa.com.br" required="" type="email" value="carlos.eduardo@empresa.com.br">

</div>

</svg>
</div>
<input autocomplete="current-password" class="block w-full pl-10 pr-10 py-2.5 text-sm text-brand-dark bg-white border border-slate-300 rounded-lg placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-royal focus:border-brand-royal transition duration-150" id="password" name="password" placeholder="••••••••••••" required="" type="password" value="••••••••••••">

<!-- BEGIN: InteractiveScripts -->
<script data-purpose="auth-interactivity">
    // Switch Profile demo modes between Colaborador and Gestor TI
    function switchProfile(role) {
      const emailInput = document.getElementById('email-address');
      const tabColaborador = document.getElementById('tab-colaborador');
      const tabGestor = document.getElementById('tab-gestor');
      const codeSnippetEmail = document.getElementById('code-email');

      if (role === 'colaborador') {
        emailInput.value = 'carlos.eduardo@empresa.com.br';
        codeSnippetEmail.textContent = "'carlos.eduardo@empresa.com.br'";
        
        tabColaborador.className = 'flex-1 py-2 px-3 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-150 text-white bg-brand-royal shadow-sm';
        tabGestor.className = 'flex-1 py-2 px-3 text-xs sm:text-sm font-medium rounded-lg transition-all duration-150 text-slate-600 hover:text-brand-dark hover:bg-slate-200/60';
      } else {
        emailInput.value = 'admin.ti@empresa.com.br';
        codeSnippetEmail.textContent = "'admin.ti@empresa.com.br'";
        
        tabGestor.className = 'flex-1 py-2 px-3 text-xs sm:text-sm font-semibold rounded-lg transition-all duration-150 text-white bg-brand-navy shadow-sm';
        tabColaborador.className = 'flex-1 py-2 px-3 text-xs sm:text-sm font-medium rounded-lg transition-all duration-150 text-slate-600 hover:text-brand-dark hover:bg-slate-200/60';
      }
    }

    // Toggle Password Visibility
    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eye-icon');
      const eyeOffIcon = document.getElementById('eye-off-icon');

      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.add('hidden');
        eyeOffIcon.classList.remove('hidden');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('hidden');
        eyeOffIcon.classList.add('hidden');
      }
    }

    // Mock Submit Handler
    function handleAuthSubmit() {
      const email = document.getElementById('email-address').value;
      alert(`Simulação de login StockTI disparada para: ${email}\nAutenticando via Supabase Auth...`);
    }

    // Mock SSO Handler
    function simulateSSO() {
      alert('Redirecionando para o Gateway Corporativo Microsoft 365 / Google Workspace...');
    }
  </script>
<!-- END: InteractiveScripts -->
